; Настройки домена marketplace.local для Open Server Panel 6.
;
; Куда положить: C:\OSPanel\home\marketplace.local\.osp\project.ini
; (папка .osp создаётся внутри папки домена, имя домена = имя папки).
;
; Наше приложение — не сайт из файлов, а программа, которая работает
; постоянно и держит порт 3000. Панель здесь работает привратником:
; принимает запрос на marketplace.local и передаёт его нашей программе.
; Программа при этом должна быть запущена — панель её не запускает.
;
; Пошагово — docs/13-local-server.md.

[marketplace.local]

; Передавать все запросы нашему приложению, а не искать файлы в папке
backend_enabled = on
backend_ip = 127.0.0.1
backend_port = 3000
