# Открывать marketplace.local вместо localhost:3000
#
# Nginx здесь — привратник: он принимает запрос на понятный адрес и передаёт
# его нашему приложению, которое работает отдельной программой на порту 3000.
# Сам Nginx приложение не запускает и не заменяет — оно должно быть запущено.
#
# Куда положить и как включить — docs/13-local-server.md.

server {
    listen 80;
    server_name marketplace.local;

    # Загрузка документов и фотографий: значение по умолчанию (1 МБ) мало
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Без этих заголовков приложение считает, что все пришли с адреса
        # самого Nginx: перестают работать ограничение частоты попыток входа
        # и журнал, в котором видно, откуда заходили
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Живое обновление страниц при разработке идёт через постоянное
        # соединение: без этих двух строк оно обрывается
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Сборка документов бывает небыстрой, минуты хватает с запасом
        proxy_read_timeout 60s;

        # Ответы отдаются сразу, а не собираются в буфер: так страница
        # начинает появляться раньше
        proxy_buffering off;
    }
}
