# Каким пакетам разрешено выполнять свои скрипты установки.
#
# По умолчанию pnpm их не выполняет — это защита от чужого кода, который
# запустится при установке зависимостей. Этим трём разрешаем осознанно:
# без сборки они просто не работают.
#
# Настройка записана дважды, потому что pnpm переименовал её в 12-й версии,
# а ставят её люди с разными версиями. Лишняя форма молча игнорируется.

# pnpm 12 и новее
allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true

# pnpm 10 и 11
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
