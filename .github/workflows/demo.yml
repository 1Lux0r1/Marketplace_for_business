name: Демо на GitHub Pages

# Демо — временная замена боевому серверу: место, куда можно посмотреть
# и что можно показать, пока VPS не куплен (вопрос 1 в docs/decisions-page.html).
# Собирается из ветки разработки при каждом изменении интерфейса.
#
# ВАЖНО: перед первым запуском включить Pages в настройках репозитория:
# Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [claude/marketplace-business-system-nd5b3m, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз: новая отменяет предыдущую, чтобы демо не отставало
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      # Демо не выкладывается, если проверки не прошли: сломанное демо
      # хуже отсутствующего — по нему принимают решения
      - name: Проверки
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Сборка
        env:
          DEMO_EXPORT: '1'
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          BUILD_VERSION="$(git describe --tags --always)" \
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          pnpm demo:build

      # Без этого файла GitHub Pages прячет папку _next, и сайт открывается без стилей
      - name: Отключить Jekyll
        run: touch out/.nojekyll

      # Выкладка возможна только при двух условиях, и оба проверяются здесь,
      # а не в задаче выкладки: та объявляет окружение github-pages и падает
      # ещё до первого шага, если условие не выполнено, — тогда никакая проверка
      # внутри неё выполниться уже не успеет.
      #
      # 1. Pages включён в настройках репозитория (галочкой, из кода нельзя).
      # 2. Ветка — основная. GitHub по умолчанию запрещает выкладку из рабочих
      #    веток, и это разумно: демо должно показывать то, что принято, а не
      #    то, что кто-то сейчас пробует.
      - name: Можно ли выкладывать
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          default_branch="${{ github.event.repository.default_branch }}"

          if [ "$code" != "200" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Демо собрано, но не выложено::GitHub Pages не включён"
            {
              echo "## Демо собрано, но выкладывать некуда"
              echo
              echo "Все проверки прошли, демо готово. Но GitHub Pages в репозитории"
              echo "не включён."
              echo
              echo "**Что сделать один раз:** Settings → Pages → Source → GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_REF" != "refs/heads/$default_branch" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Демо собрано, выложится после слияния"
              echo
              echo "Все проверки прошли и демо собралось. Выкладывается оно только"
              echo "из ветки \`$default_branch\` — так демо показывает принятое,"
              echo "а не то, что сейчас в работе."
              echo
              echo "Как только эта ветка будет влита, демо обновится само."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # Пропускаем целиком, если выкладка невозможна. Пропущенная задача
    # не красит пул-реквест в красное, а упавшая — красит, и тогда красный
    # цвет перестаёт значить «что-то сломано».
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
