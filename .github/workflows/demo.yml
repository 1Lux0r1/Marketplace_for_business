name: Демо на GitHub Pages

# Демо — временная замена боевому серверу: место, куда можно посмотреть
# и что можно показать, пока VPS не куплен (вопрос 1 в docs/decisions-page.html).
# Собирается из ветки разработки при каждом изменении интерфейса.
#
# ВАЖНО: перед первым запуском включить Pages в настройках репозитория:
# Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [claude/marketplace-business-system-nd5b3m, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз: новая отменяет предыдущую, чтобы демо не отставало
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      # Демо не выкладывается, если проверки не прошли: сломанное демо
      # хуже отсутствующего — по нему принимают решения
      - name: Проверки
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Сборка
        env:
          DEMO_EXPORT: '1'
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          BUILD_VERSION="$(git describe --tags --always)" \
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          pnpm demo:build

      # Без этого файла GitHub Pages прячет папку _next, и сайт открывается без стилей
      - name: Отключить Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages включается галочкой в настройках репозитория, из кода этого не сделать.
      # Пока галочка не стоит, выкладка невозможна — но это настройка, а не поломка,
      # и красить из-за неё пул-реквест в красное неправильно: тогда красный цвет
      # перестанет значить «что-то сломано».
      - name: Включён ли Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Что сделать, чтобы демо заработало
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "::warning title=Демо собрано, но не выложено::GitHub Pages ещё не включён"
          {
            echo "## Демо собрано, но выложить его некуда"
            echo
            echo "Сборка прошла, все проверки зелёные — демо готово, но GitHub Pages"
            echo "в репозитории пока не включён, и выкладывать некуда."
            echo
            echo "**Что сделать один раз:** Settings → Pages → Source → GitHub Actions."
            echo
            echo "После этого запустить заново: вкладка Actions → «Демо на GitHub Pages» → Re-run jobs."
          } >> "$GITHUB_STEP_SUMMARY"

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
